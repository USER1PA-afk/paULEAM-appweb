<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>PAuleam Beat 7 — Four Roles Grid</title>
  </head>
  <body>
    <template id="beat-7-template">
      <style>
        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          background: #ffffff;
          overflow: hidden;
          font-family: "Inter", "Segoe UI", system-ui, sans-serif;
          color: #121212;
        }

        .ecuador-stripe {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 12px;
          display: flex;
          z-index: 30;
        }
        .ecuador-stripe > div { flex: 1 1 0; height: 100%; }
        .stripe-yellow { background: #fcd116; }
        .stripe-blue   { background: #003893; }
        .stripe-red    { background: #cc0000; }

        /* Grid: 1280x720 centered in the 1920x1080 viewport
           (left:320 right:320 top:180 bottom:180) */
        .grid {
          position: absolute;
          top: 180px;
          left: 320px;
          width: 1280px;
          height: 720px;
          display: grid;
          grid-template-columns: 624px 624px;
          grid-template-rows: 344px 344px;
          gap: 32px;
          z-index: 10;
        }

        .quad {
          position: relative;
          width: 100%;
          height: 100%;
          background: #ffffff;
          border: 1px solid #e5e5e5;
          border-radius: 10px;
          padding: 24px;
          display: flex;
          flex-direction: column;
          gap: 12px;
          box-sizing: border-box;
          opacity: 0;
        }

        .role-badge {
          align-self: flex-start;
          padding: 6px 16px;
          border-radius: 999px;
          color: #ffffff;
          font-family: "Inter", "Segoe UI", system-ui, sans-serif;
          font-size: 14px;
          font-weight: 700;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          line-height: 1.2;
          white-space: nowrap;
        }
        .badge-cliente    { background: #3b82f6; }
        .badge-operario   { background: #f59e0b; }
        .badge-admin      { background: #cc0000; }
        .badge-pos        { background: #94c11f; }

        /* Fixed 16:9 frame — matches the admin captures' aspect ratio.
           Previously the frame used flex:1 which made it arbitrarily wide/short,
           giving the "horizontally stretched" look the user reported. */
        .screenshot-frame {
          position: relative;
          width: 100%;
          max-width: 526px;
          aspect-ratio: 16 / 9;
          align-self: center;
          overflow: hidden;
          border: 1px solid #e5e5e5;
          border-radius: 6px;
          background: #f9f9f9;
        }
        .screenshot-frame img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: top center;
        }

        .quad-desc {
          font-family: "Inter", "Segoe UI", system-ui, sans-serif;
          font-size: 15px;
          font-weight: 500;
          line-height: 1.35;
          color: #4a4a49;
          margin: 0;
          text-align: left;
        }
      </style>

      <div id="root" data-composition-id="beat-7" data-start="52" data-duration="5" data-width="1920" data-height="1080">
        <div class="ecuador-stripe">
          <div class="stripe-yellow"></div>
          <div class="stripe-blue"></div>
          <div class="stripe-red"></div>
        </div>

        <div id="grid" class="grid">
          <div id="q1" class="quad">
            <div class="role-badge badge-cliente">CLIENTE</div>
            <div class="screenshot-frame">
              <img src="capture/screenshots/cliente-mobile/01-catalog.png" alt="Catálogo de tienda" />
            </div>
            <p class="quad-desc">Compra en línea y retira con código PAU.</p>
          </div>

          <div id="q2" class="quad">
            <div class="role-badge badge-operario">OPERARIO</div>
            <div class="screenshot-frame">
              <img src="capture/screenshots/admin/05-recipes.png" alt="Recetas" />
            </div>
            <p class="quad-desc">Recetas, producción y empaque con lote automático.</p>
          </div>

          <div id="q3" class="quad">
            <div class="role-badge badge-admin">ADMINISTRADOR</div>
            <div class="screenshot-frame">
              <img src="capture/screenshots/admin/10-orders.png" alt="Órdenes" />
            </div>
            <p class="quad-desc">Inventario, proveedores y aprobación de pedidos.</p>
          </div>

          <div id="q4" class="quad">
            <div class="role-badge badge-pos">PUNTO DE VENTA</div>
            <div class="screenshot-frame">
              <img src="capture/screenshots/admin/13-pos-kiosk.png" alt="Punto de venta" />
            </div>
            <p class="quad-desc">Cobra en Efectivo o QR Deuna.</p>
          </div>
        </div>
      </div>

      <script>
        (function () {
          if (typeof window === "undefined" || !window.gsap) return;
          window.__timelines = window.__timelines || {};
          const tl = window.gsap.timeline({ paused: true });

          // Pure opacity fade-in for each quadrant. NO translate / NO scale.
          tl.fromTo("#q1", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.0);
          tl.fromTo("#q2", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.3);
          tl.fromTo("#q3", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.6);
          tl.fromTo("#q4", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.9);

          window.__timelines["beat-7"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
