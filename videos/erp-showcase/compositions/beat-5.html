<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>PAuleam Beat 5 — Administrador</title>
  </head>
  <body>
    <template id="beat-5-template">
      <style>
        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: #ffffff;
          font-family: "Inter", "Segoe UI", system-ui, sans-serif;
          color: #121212;
        }

        .camera {
          position: absolute;
          inset: 0;
          transform-origin: center center;
        }

        .ecuador-stripe {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 12px;
          display: flex;
          z-index: 30;
        }
        .ecuador-stripe > div { flex: 1 1 0; height: 100%; }
        .stripe-yellow { background: #fcd116; }
        .stripe-blue   { background: #003893; }
        .stripe-red    { background: #cc0000; }

        .role-badge {
          position: absolute;
          top: 36px;
          left: 32px;
          z-index: 25;
          padding: 8px 16px;
          border-radius: 999px;
          background: #cc0000;
          color: #ffffff;
          font-family: "Inter", "Segoe UI", system-ui, sans-serif;
          font-size: 14px;
          font-weight: 700;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          line-height: 1;
        }

        /* All 3 moments fill the viewport. Only one is visible at a time
           (cross-faded). No movement on the texts/descriptions. */
        .moment {
          position: absolute;
          inset: 0;
          z-index: 10;
          opacity: 0;
        }

        .label-eyebrow {
          position: absolute;
          top: 100px;
          left: 32px;
          z-index: 12;
          color: #cc0000;
          font-family: "Inter", "Segoe UI", system-ui, sans-serif;
          font-size: 14px;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.1em;
          line-height: 1;
          white-space: nowrap;
        }
        .label-desc {
          position: absolute;
          top: 132px;
          left: 32px;
          z-index: 12;
          color: #121212;
          font-family: "Inter", "Segoe UI", system-ui, sans-serif;
          font-size: 22px;
          font-weight: 500;
          line-height: 1.2;
          max-width: 520px;
        }

        .screenshot-anchor {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: 1344px;
          height: 648px;
          max-width: 70%;
          max-height: 60%;
        }
        .screenshot-frame {
          position: relative;
          width: 100%;
          height: 100%;
          overflow: hidden;
          border: 1px solid #e5e5e5;
          border-radius: 10px;
          background: #ffffff;
        }
        .screenshot-frame img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: top center;
        }

        /* Moment A overlay: green counter chip */
        .counter-chip {
          position: absolute;
          top: 250px;
          left: 880px;
          z-index: 20;
          padding: 8px 18px;
          background: #94c11f;
          border-radius: 999px;
          color: #ffffff;
          font-family: "Inter", "Segoe UI", system-ui, sans-serif;
          font-size: 18px;
          font-weight: 800;
          font-variant-numeric: tabular-nums;
          letter-spacing: 0.02em;
          line-height: 1;
          white-space: nowrap;
          box-shadow: 0 4px 14px rgba(148, 193, 31, 0.35);
          opacity: 0;
        }
        .counter-chip .counter-value { display: inline-block; }
        .counter-chip .counter-unit {
          display: inline-block;
          margin-left: 6px;
          font-weight: 600;
          font-size: 14px;
          letter-spacing: 0.04em;
          opacity: 0.92;
        }

        /* Moment B overlays: category chips row */
        .chips-row {
          position: absolute;
          top: 200px;
          left: 32px;
          z-index: 13;
          display: flex;
          gap: 10px;
        }
        .chip {
          padding: 8px 16px;
          border-radius: 999px;
          color: #ffffff;
          font-family: "Inter", "Segoe UI", system-ui, sans-serif;
          font-size: 12px;
          font-weight: 700;
          letter-spacing: 0.06em;
          text-transform: uppercase;
          line-height: 1;
          white-space: nowrap;
          opacity: 0;
        }
        .chip-mp { background: #cc0000; }
        .chip-in { background: #f59e0b; }
        .chip-en { background: #3b82f6; }

        /* Moment C overlays: red ring + green checkmark */
        .ring-wrap {
          position: absolute;
          top: 337px;
          left: 1107px;
          width: 96px;
          height: 96px;
          z-index: 20;
          pointer-events: none;
          opacity: 0;
        }
        .ring-wrap svg {
          width: 100%;
          height: 100%;
          display: block;
          overflow: visible;
        }
        .ring-wrap .ring-circle {
          fill: none;
          stroke: #cc0000;
          stroke-width: 4;
          stroke-dasharray: 283;
          stroke-dashoffset: 283;
          transform: rotate(-90deg);
          transform-origin: 50% 50%;
        }
        .ring-wrap .ring-circle-pulse {
          fill: none;
          stroke: #cc0000;
          stroke-width: 2;
          opacity: 0.5;
        }

        .check-wrap {
          position: absolute;
          top: 371px;
          left: 298px;
          width: 28px;
          height: 28px;
          z-index: 20;
          pointer-events: none;
          opacity: 0;
        }
        .check-wrap svg {
          width: 100%;
          height: 100%;
          display: block;
        }
        .check-wrap .check-path {
          fill: none;
          stroke: #94c11f;
          stroke-width: 3.5;
          stroke-linecap: round;
          stroke-linejoin: round;
          stroke-dasharray: 32;
          stroke-dashoffset: 32;
        }
      </style>

      <div id="root" data-composition-id="beat-5" data-start="0" data-duration="12" data-width="1920" data-height="1080">
        <div class="ecuador-stripe">
          <div class="stripe-yellow"></div>
          <div class="stripe-blue"></div>
          <div class="stripe-red"></div>
        </div>

        <div class="role-badge">ADMINISTRADOR</div>

        <div class="camera">
          <!-- 1) INVENTARIO (0.0 - 4.0s) -->
          <div id="moment-a" class="moment">
            <div class="label-eyebrow">1. INVENTARIO</div>
            <div class="label-desc">Doble entrada inmutable. Cada movimiento es un registro.</div>
            <div class="screenshot-anchor">
              <div class="screenshot-frame">
                <img src="capture/screenshots/admin/02-inventory.png" alt="Inventario">
                <div class="counter-chip" id="counter-chip">
                  <span class="counter-value" id="counter-value">0,00</span>
                  <span class="counter-unit">lt</span>
                </div>
              </div>
            </div>
          </div>

          <!-- 2) PROVEEDORES (4.0 - 8.0s) -->
          <div id="moment-b" class="moment">
            <div class="label-eyebrow">2. PROVEEDORES</div>
            <div class="label-desc">Materia prima, insumos, envases. Un producto, muchos proveedores.</div>
            <div class="screenshot-anchor">
              <div class="screenshot-frame">
                <img src="capture/screenshots/admin/09-suppliers.png" alt="Proveedores">
              </div>
            </div>
            <div class="chips-row">
              <div class="chip chip-mp" id="chip-mp">MATERIA_PRIMA</div>
              <div class="chip chip-in" id="chip-in">INSUMO</div>
              <div class="chip chip-en" id="chip-en">ENVASE_EMPAQUE</div>
            </div>
          </div>

          <!-- 3) ÓRDENES (8.0 - 12.0s) -->
          <div id="moment-c" class="moment">
            <div class="label-eyebrow">3. ÓRDENES</div>
            <div class="label-desc">Aprueba o rechaza cada pedido.</div>
            <div class="screenshot-anchor">
              <div class="screenshot-frame">
                <img src="capture/screenshots/admin/10-orders.png" alt="Órdenes de Venta">
                <div class="ring-wrap" id="ring-wrap">
                  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle class="ring-circle-pulse" cx="50" cy="50" r="45" />
                    <circle class="ring-circle" cx="50" cy="50" r="45" />
                  </svg>
                </div>
                <div class="check-wrap" id="check-wrap">
                  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path class="check-path" d="M4 12.5 L10 18.5 L20 6.5" />
                  </svg>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          if (typeof window === "undefined" || !window.gsap) return;
          window.__timelines = window.__timelines || {};
          const tl = window.gsap.timeline({ paused: true });

          // ====================================================================
          // MOMENT A — INVENTARIO (0.0s - 3.3s)
          // Pure opacity. No movement on text/descriptions.
          // ====================================================================
          tl.set("#moment-a", { opacity: 0 });
          tl.set("#moment-b", { opacity: 0 });
          tl.set("#moment-c", { opacity: 0 });
          tl.set("#counter-chip", { opacity: 0 });
          tl.set("#chip-mp", { opacity: 0 });
          tl.set("#chip-in", { opacity: 0 });
          tl.set("#chip-en", { opacity: 0 });
          tl.set("#ring-wrap", { opacity: 0 });
          tl.set("#check-wrap", { opacity: 0 });

          tl.to("#moment-a", { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.0);

          // 1.0s: green counter chip fades in
          tl.to("#counter-chip", { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.0);

          // 1.0s: counter ticks 0 -> 390 over 1.2s
          const counterEl = document.querySelector("#counter-value");
          const counterProxy = { n: 0 };
          tl.set("#counter-value", { textContent: "0,00" }, 1.0);
          tl.to(counterProxy, {
            n: 390,
            duration: 1.2,
            ease: "power2.out",
            onUpdate: function () {
              counterEl.textContent = counterProxy.n.toFixed(2).replace(".", ",");
            },
          }, 1.0);

          // ====================================================================
          // MOMENT B — PROVEEDORES (3.3s - 6.6s) — cross-fade from A
          // ====================================================================
          tl.to("#moment-a", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 3.3);
          tl.to("#moment-b", { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 3.3);

          // 4.3/4.45/4.6: category chips stagger in (opacity only)
          tl.to("#chip-mp", { opacity: 1, duration: 0.4, ease: "power2.out" }, 4.3);
          tl.to("#chip-in", { opacity: 1, duration: 0.4, ease: "power2.out" }, 4.45);
          tl.to("#chip-en", { opacity: 1, duration: 0.4, ease: "power2.out" }, 4.6);

          // ====================================================================
          // MOMENT C — ÓRDENES (6.6s - 12.0s) — cross-fade from B
          // ====================================================================
          tl.to("#moment-b", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 6.6);
          tl.to("#moment-c", { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 6.6);

          // 8.0s: red ring fades in (no scale, no movement)
          tl.to("#ring-wrap", { opacity: 1, duration: 0.3, ease: "power2.out" }, 8.0);
          // ring stroke draws in (stroke-dashoffset)
          tl.fromTo("#ring-wrap .ring-circle", { strokeDashoffset: 283 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 8.0);

          // 9.3s: checkmark appears (opacity + stroke draws)
          tl.to("#check-wrap", { opacity: 1, duration: 0.3, ease: "power2.out" }, 9.3);
          tl.fromTo("#check-wrap .check-path", { strokeDashoffset: 32 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 9.3);

          window.__timelines["beat-5"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
