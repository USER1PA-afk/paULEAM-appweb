<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>PAuleam Beat 8 — Tagline Close (portrait)</title>
  </head>
  <body>
    <template id="beat-8-template">
      <style>
        #root {
          position: relative;
          width: 1080px;
          height: 1920px;
          background: #ffffff;
          overflow: hidden;
          font-family: "Inter", "Segoe UI", system-ui, sans-serif;
          color: #121212;
        }

        .ecuador-stripe {
          position: absolute;
          top: 0;
          right: 0;
          width: 16px;
          height: 1920px;
          display: flex;
          flex-direction: column;
          z-index: 20;
        }
        .ecuador-stripe > div { flex: 1 1 0; }
        .s-y { background: #fcd116; }
        .s-b { background: #003893; }
        .s-r { background: #cc0000; }

        .content {
          position: absolute;
          top: 600px;
          left: 0;
          right: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          will-change: transform;
        }

        .tagline {
          margin: 0;
          padding: 0 60px;
          font-family: "Inter", "Segoe UI", system-ui, sans-serif;
          font-weight: 700;
          font-size: 44px;
          line-height: 1.25;
          color: #121212;
          letter-spacing: -0.01em;
          text-align: center;
          max-width: 960px;
          will-change: transform, opacity;
        }

        .logo-row {
          margin-top: 60px;
          display: flex;
          align-items: center;
          gap: 24px;
          will-change: transform, opacity;
        }

        .plant-icon {
          width: 80px;
          height: 80px;
          display: block;
        }
        .plant-path {
          stroke: #cc0000;
          stroke-width: 3;
          fill: none;
          stroke-linecap: round;
          stroke-linejoin: round;
        }

        .wordmark {
          display: inline-block;
          font-family: "Inter", "Segoe UI", system-ui, sans-serif;
          font-weight: 800;
          font-size: 80px;
          line-height: 1;
          color: #cc0000;
          letter-spacing: -0.02em;
          will-change: transform, opacity;
        }

        .footer {
          position: absolute;
          top: 1700px;
          left: 0;
          right: 0;
          text-align: center;
          font-family: "Inter", "Segoe UI", system-ui, sans-serif;
          font-size: 16px;
          font-weight: 500;
          line-height: 1;
          color: #4a4a49;
          opacity: 0;
          letter-spacing: 0.02em;
          will-change: opacity;
        }

        .accent-line {
          position: absolute;
          left: 32px;
          right: 32px;
          top: 1800px;
          height: 4px;
          background: #cc0000;
          transform-origin: left center;
          z-index: 15;
          will-change: transform;
        }

        .black-out {
          position: absolute;
          inset: 0;
          background: #000000;
          opacity: 0;
          z-index: 50;
          pointer-events: none;
          will-change: opacity;
        }
      </style>

      <div
        id="root"
        data-composition-id="beat-8"
        data-start="57"
        data-duration="3"
        data-width="1080"
        data-height="1920"
      >
        <div class="ecuador-stripe">
          <div class="s-y"></div>
          <div class="s-b"></div>
          <div class="s-r"></div>
        </div>

        <div class="content">
          <h1 class="tagline">De la materia prima a la venta, en un solo sistema.</h1>

          <div class="logo-row">
            <svg
              class="plant-icon"
              viewBox="0 0 80 80"
              width="80"
              height="80"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path class="plant-path" pathLength="100" d="M40 10 L40 70" />
              <path class="plant-path" pathLength="100" d="M40 20 Q20 15 15 30 Q35 30 40 25" />
              <path class="plant-path" pathLength="100" d="M40 20 Q60 15 65 30 Q45 30 40 25" />
              <path class="plant-path" pathLength="100" d="M40 40 Q20 35 15 50 Q35 50 40 45" />
              <path class="plant-path" pathLength="100" d="M40 40 Q60 35 65 50 Q45 50 40 45" />
            </svg>
            <span class="wordmark">PAuleam</span>
          </div>
        </div>

        <div class="footer">uleam.edu.ec &middot; Planta de Alimentos &middot; 2026</div>

        <div class="accent-line"></div>

        <div class="black-out"></div>
      </div>

      <script>
        (function () {
          if (typeof window === "undefined" || !window.gsap) return;
          window.__timelines = window.__timelines || {};
          const tl = window.gsap.timeline({ paused: true });

          tl.set(".tagline", { y: 16, opacity: 0 }, 0);
          tl.set(".plant-path", { strokeDasharray: 100, strokeDashoffset: 100 }, 0);
          tl.set(".wordmark", { y: 12, opacity: 0 }, 0);
          tl.set(".footer", { opacity: 0 }, 0);
          tl.set(".accent-line", { scaleX: 0 }, 0);
          tl.set(".black-out", { opacity: 0 }, 0);

          tl.fromTo(
            ".tagline",
            { y: 16, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
            0.0
          );

          tl.to(
            ".plant-path",
            { strokeDashoffset: 0, duration: 0.8, ease: "power2.out", stagger: 0.04 },
            0.6
          );

          tl.fromTo(
            ".wordmark",
            { y: 12, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" },
            0.9
          );

          tl.fromTo(
            ".footer",
            { opacity: 0 },
            { opacity: 0.6, duration: 0.2, ease: "power2.out" },
            1.2
          );

          tl.fromTo(
            ".accent-line",
            { scaleX: 0 },
            { scaleX: 1, duration: 0.6, ease: "expo.out", transformOrigin: "left center" },
            1.4
          );

          tl.fromTo(
            ".content",
            { y: 0 },
            { y: -4, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 0 },
            2.0
          );

          tl.fromTo(
            ".black-out",
            { opacity: 0 },
            { opacity: 1, duration: 0.3, ease: "power2.in" },
            2.7
          );

          window.__timelines["beat-8"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
