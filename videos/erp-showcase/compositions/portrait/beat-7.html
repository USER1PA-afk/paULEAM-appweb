<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>PAuleam Beat 7 — Four Roles Grid (portrait)</title>
  </head>
  <body>
    <template id="beat-7-template">
      <style>
        #root {
          position: relative;
          width: 1080px;
          height: 1920px;
          background: #ffffff;
          overflow: hidden;
          font-family: "Inter", "Segoe UI", system-ui, sans-serif;
          color: #121212;
        }

        .ecuador-stripe {
          position: absolute;
          top: 0;
          right: 0;
          width: 16px;
          height: 1920px;
          display: flex;
          flex-direction: column;
          z-index: 30;
        }
        .ecuador-stripe > div { flex: 1 1 0; }
        .s-y { background: #fcd116; }
        .s-b { background: #003893; }
        .s-r { background: #cc0000; }

        .headline {
          position: absolute;
          top: 200px;
          left: 100px;
          right: 100px;
          z-index: 12;
          margin: 0;
          font-family: "Inter", "Segoe UI", system-ui, sans-serif;
          font-size: 36px;
          font-weight: 700;
          line-height: 1.2;
          color: #121212;
          text-align: center;
          letter-spacing: -0.01em;
        }

        .grid {
          position: absolute;
          top: 380px;
          left: 100px;
          width: 880px;
          height: 880px;
          display: grid;
          grid-template-columns: 432px 432px;
          grid-template-rows: 432px 432px;
          gap: 16px;
          z-index: 10;
          will-change: opacity;
        }

        .quad {
          position: relative;
          width: 100%;
          height: 100%;
          background: #ffffff;
          border: 1px solid #e5e5e5;
          border-radius: 10px;
          padding: 28px;
          display: flex;
          flex-direction: column;
          gap: 18px;
          box-sizing: border-box;
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }

        .role-badge {
          align-self: flex-start;
          padding: 8px 18px;
          border-radius: 999px;
          color: #ffffff;
          font-family: "Inter", "Segoe UI", system-ui, sans-serif;
          font-size: 16px;
          font-weight: 700;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          line-height: 1.2;
          white-space: nowrap;
        }
        .badge-cliente    { background: #3b82f6; }
        .badge-operario   { background: #f59e0b; }
        .badge-admin      { background: #cc0000; }
        .badge-pos        { background: #94c11f; }

        .screenshot-frame {
          position: relative;
          width: 376px;
          height: 211px;
          align-self: center;
          overflow: hidden;
          border: 1px solid #e5e5e5;
          border-radius: 6px;
          background: #f9f9f9;
          transform-origin: 50% 50%;
          will-change: transform;
        }
        .screenshot-frame img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: top center;
        }

        .quad-desc {
          font-family: "Inter", "Segoe UI", system-ui, sans-serif;
          font-size: 18px;
          font-weight: 500;
          line-height: 1.4;
          color: #4a4a49;
          margin: 0;
          text-align: left;
        }

        .footer {
          position: absolute;
          top: 1310px;
          left: 0;
          right: 0;
          text-align: center;
          font-family: "Inter", "Segoe UI", system-ui, sans-serif;
          font-size: 18px;
          font-weight: 500;
          color: #4a4a49;
          opacity: 0.6;
          letter-spacing: 0.02em;
          z-index: 12;
        }
      </style>

      <div
        id="root"
        data-composition-id="beat-7"
        data-start="52"
        data-duration="5"
        data-width="1080"
        data-height="1920"
      >
        <div class="ecuador-stripe">
          <div class="s-y"></div>
          <div class="s-b"></div>
          <div class="s-r"></div>
        </div>

        <h2 class="headline">Cuatro roles. Una sola operación.</h2>

        <div id="grid" class="grid">
          <div id="q1" class="quad">
            <div class="role-badge badge-cliente">CLIENTE</div>
            <div class="screenshot-frame">
              <img src="capture/screenshots/admin/14-shop-catalog.png" alt="Catálogo de tienda" />
            </div>
            <p class="quad-desc">Compra en línea y retira con código PAU.</p>
          </div>

          <div id="q2" class="quad">
            <div class="role-badge badge-operario">OPERARIO</div>
            <div class="screenshot-frame">
              <img src="capture/screenshots/admin/05-recipes.png" alt="Recetas" />
            </div>
            <p class="quad-desc">Recetas, producción y empaque con lote automático.</p>
          </div>

          <div id="q3" class="quad">
            <div class="role-badge badge-admin">ADMINISTRADOR</div>
            <div class="screenshot-frame">
              <img src="capture/screenshots/admin/10-orders.png" alt="Órdenes" />
            </div>
            <p class="quad-desc">Inventario, proveedores y aprobación de pedidos.</p>
          </div>

          <div id="q4" class="quad">
            <div class="role-badge badge-pos">PUNTO DE VENTA</div>
            <div class="screenshot-frame">
              <img src="capture/screenshots/admin/13-pos-kiosk.png" alt="Punto de venta" />
            </div>
            <p class="quad-desc">Cobra en Efectivo o QR Deuna.</p>
          </div>
        </div>

        <div class="footer">PAuleam · Sistema ERP v2</div>
      </div>

      <script>
        (function () {
          if (typeof window === "undefined" || !window.gsap) return;
          window.__timelines = window.__timelines || {};
          const tl = window.gsap.timeline({ paused: true });

          // ---------- Initial states (frame 0) ----------
          tl.set("#grid", { opacity: 0 }, 0);
          tl.set(".headline", { y: 16, opacity: 0 }, 0);
          tl.set(".footer", { opacity: 0 }, 0);
          tl.set("#q1, #q2, #q3, #q4", { scale: 0.7, opacity: 0, transformOrigin: "50% 50%" }, 0);

          // ============================================================
          // HEADLINE FADE IN — 0.0s -> 0.4s
          // ============================================================
          tl.fromTo(
            ".headline",
            { y: 16, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" },
            0.0
          );

          // ============================================================
          // GRID FADE IN — 0.0s -> 0.3s
          // ============================================================
          tl.fromTo(
            "#grid",
            { opacity: 0 },
            { opacity: 1, duration: 0.3, ease: "power2.out" },
            0.0
          );

          // ============================================================
          // QUADRANT POP-INS (staggered, back.out(1.6), 0.6s each)
          // ============================================================
          tl.fromTo(
            "#q1",
            { scale: 0.7, opacity: 0 },
            { scale: 1.0, opacity: 1, duration: 0.6, ease: "back.out(1.6)" },
            0.3
          );
          tl.fromTo(
            "#q2",
            { scale: 0.7, opacity: 0 },
            { scale: 1.0, opacity: 1, duration: 0.6, ease: "back.out(1.6)" },
            0.6
          );
          tl.fromTo(
            "#q3",
            { scale: 0.7, opacity: 0 },
            { scale: 1.0, opacity: 1, duration: 0.6, ease: "back.out(1.6)" },
            0.9
          );
          tl.fromTo(
            "#q4",
            { scale: 0.7, opacity: 0 },
            { scale: 1.0, opacity: 1, duration: 0.6, ease: "back.out(1.6)" },
            1.2
          );

          // ============================================================
          // FOOTER FADE IN — 1.5s
          // ============================================================
          tl.fromTo(
            ".footer",
            { opacity: 0 },
            { opacity: 0.6, duration: 0.4, ease: "power2.out" },
            1.5
          );

          // ============================================================
          // SCREENSHOT BREATHE — 1.8s onward (stagger 0.2s, 2s yoyo)
          // ============================================================
          tl.fromTo(
            "#q1 .screenshot-frame",
            { scale: 1.0 },
            { scale: 1.03, duration: 2.0, ease: "sine.inOut", yoyo: true, repeat: 1 },
            1.8
          );
          tl.fromTo(
            "#q2 .screenshot-frame",
            { scale: 1.0 },
            { scale: 1.03, duration: 2.0, ease: "sine.inOut", yoyo: true, repeat: 1 },
            2.0
          );
          tl.fromTo(
            "#q3 .screenshot-frame",
            { scale: 1.0 },
            { scale: 1.03, duration: 2.0, ease: "sine.inOut", yoyo: true, repeat: 1 },
            2.2
          );
          tl.fromTo(
            "#q4 .screenshot-frame",
            { scale: 1.0 },
            { scale: 1.03, duration: 2.0, ease: "sine.inOut", yoyo: true, repeat: 1 },
            2.4
          );

          window.__timelines["beat-7"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
