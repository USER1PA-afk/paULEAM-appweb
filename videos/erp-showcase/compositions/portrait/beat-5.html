<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>PAuleam — Beat 5: Administrador (Portrait, no screenshots)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <template id="beat-5-template">
      <style>
        #root {
          position: relative;
          width: 1080px;
          height: 1920px;
          background: #ffffff;
          overflow: hidden;
          font-family: "Inter", "Segoe UI", system-ui, sans-serif;
          color: #121212;
        }

        .ecuador-stripe {
          position: absolute;
          top: 0;
          right: 0;
          width: 16px;
          height: 1920px;
          display: flex;
          flex-direction: column;
          z-index: 30;
        }
        .ecuador-stripe > div { flex: 1 1 0; }
        .s-y { background: #fcd116; }
        .s-b { background: #003893; }
        .s-r { background: #cc0000; }

        .role-badge {
          position: absolute;
          top: 60px;
          left: 60px;
          z-index: 25;
          padding: 12px 24px;
          border-radius: 999px;
          background: #cc0000;
          color: #ffffff;
          font-family: "Inter", "Segoe UI", system-ui, sans-serif;
          font-size: 20px;
          font-weight: 700;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          line-height: 1;
          opacity: 0;
        }

        .headline-block {
          position: absolute;
          top: 160px;
          left: 60px;
          right: 80px;
          z-index: 12;
          opacity: 0;
        }
        .headline-eyebrow {
          display: block;
          font-size: 18px;
          font-weight: 700;
          color: #cc0000;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          margin-bottom: 16px;
        }
        .headline-title {
          display: block;
          font-size: 60px;
          font-weight: 800;
          line-height: 1.05;
          color: #121212;
          letter-spacing: -0.02em;
        }
        .headline-title em {
          font-style: normal;
          color: #cc0000;
        }

        .card-stack {
          position: absolute;
          top: 540px;
          left: 60px;
          right: 60px;
          bottom: 100px;
          z-index: 12;
          display: flex;
          flex-direction: column;
          gap: 28px;
        }
        .feature-card {
          position: relative;
          flex: 1 1 0;
          background: #ffffff;
          border: 1px solid #e5e5e5;
          border-radius: 18px;
          padding: 36px 40px 36px 168px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          opacity: 0;
        }
        .feature-card::before {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          width: 6px;
          height: 100%;
          border-radius: 18px 0 0 18px;
        }
        .feature-card.green::before  { background: #94c11f; }
        .feature-card.red::before    { background: #cc0000; }
        .feature-card.amber::before  { background: #f59e0b; }

        .feature-icon {
          position: absolute;
          top: 50%;
          left: 36px;
          transform: translateY(-50%);
          width: 104px;
          height: 104px;
          border-radius: 22px;
          display: flex;
          align-items: center;
          justify-content: center;
          opacity: 0;
        }
        .feature-icon.green  { background: rgba(148, 193, 31, 0.14); color: #4f7a0e; }
        .feature-icon.red    { background: rgba(204, 0, 0, 0.10);   color: #cc0000; }
        .feature-icon.amber  { background: rgba(245, 158, 11, 0.12); color: #b45309; }
        .feature-icon svg { width: 56px; height: 56px; display: block; }

        .feature-eyebrow {
          font-size: 12px;
          font-weight: 700;
          letter-spacing: 0.18em;
          text-transform: uppercase;
          line-height: 1;
          margin-bottom: 12px;
        }
        .feature-eyebrow.green  { color: #4f7a0e; }
        .feature-eyebrow.red    { color: #cc0000; }
        .feature-eyebrow.amber  { color: #b45309; }

        .feature-title {
          font-size: 32px;
          font-weight: 800;
          line-height: 1.1;
          color: #121212;
          letter-spacing: -0.01em;
          margin-bottom: 10px;
        }

        .feature-desc {
          font-size: 19px;
          font-weight: 500;
          line-height: 1.4;
          color: #4a4a49;
        }

        .footer-mark {
          position: absolute;
          bottom: 36px;
          left: 0;
          right: 0;
          text-align: center;
          font-family: ui-monospace, "SF Mono", Consolas, monospace;
          font-size: 14px;
          font-weight: 500;
          color: #4a4a49;
          letter-spacing: 0.08em;
          opacity: 0;
        }
      </style>

      <div
        id="root"
        data-composition-id="beat-5"
        data-start="32"
        data-duration="12"
        data-width="1080"
        data-height="1920"
      >
        <div class="ecuador-stripe" aria-hidden="true">
          <div class="s-y"></div>
          <div class="s-b"></div>
          <div class="s-r"></div>
        </div>

        <div class="role-badge" id="role-badge">ADMINISTRADOR</div>

        <div class="headline-block" id="headline">
          <span class="headline-eyebrow">ROL 4 / 4</span>
          <h1 class="headline-title">
            Decisiones <em>informadas</em>,<br/>
            control total.
          </h1>
        </div>

        <div class="card-stack">
          <div class="feature-card red" id="card-1">
            <div class="feature-icon red" id="icon-1">
              <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="6"  y="6"  width="20" height="20" rx="3" stroke="#cc0000" stroke-width="3"/>
                <rect x="30" y="6"  width="20" height="14" rx="3" stroke="#cc0000" stroke-width="3"/>
                <rect x="6"  y="30" width="20" height="20" rx="3" stroke="#cc0000" stroke-width="3"/>
                <rect x="30" y="24" width="20" height="26" rx="3" fill="#cc0000"/>
              </svg>
            </div>
            <div class="feature-eyebrow red">DASHBOARD</div>
            <div class="feature-title">Visión general en vivo</div>
            <div class="feature-desc">KPIs de producción, ventas y stock. Todo en una sola pantalla, actualizado al instante.</div>
          </div>

          <div class="feature-card amber" id="card-2">
            <div class="feature-icon amber" id="icon-2">
              <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M8 18 L28 8 L48 18 L48 38 L28 48 L8 38 Z" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/>
                <path d="M8 18 L28 28 L48 18" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/>
                <path d="M28 28 L28 48" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/>
                <circle cx="40" cy="14" r="3" fill="#f59e0b"/>
              </svg>
            </div>
            <div class="feature-eyebrow amber">CATÁLOGO + PROVEEDORES</div>
            <div class="feature-title">Control del catálogo</div>
            <div class="feature-desc">Productos, precios y proveedores. Un producto, N proveedores con rotación automática.</div>
          </div>

          <div class="feature-card green" id="card-3">
            <div class="feature-icon green" id="icon-3">
              <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="10" y="6" width="32" height="42" rx="3" stroke="#4f7a0e" stroke-width="3"/>
                <line x1="16" y1="16" x2="36" y2="16" stroke="#4f7a0e" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="16" y1="24" x2="36" y2="24" stroke="#4f7a0e" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="16" y1="32" x2="28" y2="32" stroke="#4f7a0e" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="40" cy="44" r="11" fill="#94c11f"/>
                <path d="M34 44 L39 49 L46 41" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              </svg>
            </div>
            <div class="feature-eyebrow green">APROBACIÓN DE PEDIDOS</div>
            <div class="feature-title">Valida y despacha</div>
            <div class="feature-desc">Aprueba pagos, confirma entregas y asigna código de retiro. Trazabilidad total.</div>
          </div>
        </div>

        <div class="footer-mark" id="footer">ULEAM &middot; Planta de Alimentos &middot; 2026</div>
      </div>

      <script>
        (function () {
          if (typeof window === "undefined" || !window.gsap) return;
          window.__timelines = window.__timelines || {};
          const tl = window.gsap.timeline({ paused: true });

          tl.fromTo(".ecuador-stripe > div:nth-child(1)", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out", transformOrigin: "top center" }, 0);
          tl.fromTo(".ecuador-stripe > div:nth-child(2)", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out", transformOrigin: "top center" }, 0.05);
          tl.fromTo(".ecuador-stripe > div:nth-child(3)", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out", transformOrigin: "top center" }, 0.1);

          // TEXTS: pure opacity fade, NO translate / NO scale
          tl.fromTo("#role-badge", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.3);
          tl.fromTo("#headline",   { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.5);

          // Icons + cards: pure opacity, no movement
          tl.fromTo("#icon-1", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.2);
          tl.fromTo("#card-1", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.4);

          tl.fromTo("#icon-2", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.8);
          tl.fromTo("#card-2", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 2.0);

          tl.fromTo("#icon-3", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.4);
          tl.fromTo("#card-3", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 2.6);

          tl.fromTo("#footer", { opacity: 0 }, { opacity: 0.5, duration: 0.4 }, 11.0);

          window.__timelines["beat-5"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
