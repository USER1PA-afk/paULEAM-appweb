<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>PAuleam Beat 1 — Brand Hero (Portrait)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <template id="beat-1-template">
      <style>
        #root {
          position: relative;
          width: 1080px;
          height: 1920px;
          background: #FFFFFF;
          overflow: hidden;
          font-family: "Inter", system-ui, sans-serif;
          color: #121212;
        }

        .ecuador-stripe {
          position: absolute;
          top: 0;
          right: 0;
          width: 16px;
          height: 1920px;
          display: flex;
          flex-direction: column;
          z-index: 10;
        }
        .ecuador-stripe > div { flex: 1 1 0; }
        .s-y { background: #FCD116; }
        .s-b { background: #003893; }
        .s-r { background: #CC0000; }

        .content {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 0 80px 0 80px;
        }

        .logo-frame {
          display: flex;
          align-items: center;
          justify-content: center;
          will-change: transform, opacity;
        }

        .logo-frame img {
          display: block;
          width: 260px;
          height: auto;
          object-fit: contain;
        }

        .wordmark {
          display: block;
          margin-top: 36px;
          font-family: "Inter", system-ui, sans-serif;
          font-weight: 800;
          font-size: 200px;
          line-height: 1;
          color: #CC0000;
          letter-spacing: -0.04em;
          will-change: transform, opacity;
        }

        .slogan {
          display: block;
          margin-top: 36px;
          font-family: "Inter", system-ui, sans-serif;
          font-weight: 500;
          font-size: 44px;
          line-height: 1.2;
          color: #121212;
          letter-spacing: -0.005em;
          text-align: center;
          max-width: 880px;
          will-change: transform, opacity;
        }

        .slogan-word {
          display: inline-block;
        }

        .footer {
          position: absolute;
          bottom: 80px;
          left: 0;
          right: 0;
          text-align: center;
          font-family: ui-monospace, "SF Mono", Consolas, monospace;
          font-size: 20px;
          font-weight: 500;
          color: #4A4A49;
          opacity: 0;
          letter-spacing: 0.08em;
        }
      </style>

      <div
        id="root"
        data-composition-id="beat-1"
        data-start="0"
        data-duration="5"
        data-width="1080"
        data-height="1920"
      >
        <div class="ecuador-stripe" aria-hidden="true">
          <div class="s-y"></div>
          <div class="s-b"></div>
          <div class="s-r"></div>
        </div>

        <div class="content">
          <div class="logo-frame">
            <img src="assets/logo-pauleam.png" alt="PAuleam" />
          </div>
          <h1 class="wordmark">PAuleam</h1>
          <h2 class="slogan">
            <span class="slogan-word">Gestión</span>
            <span class="slogan-word">Integral</span>
            <span class="slogan-word">de</span>
            <span class="slogan-word">tu</span>
            <span class="slogan-word">Planta</span>
            <span class="slogan-word">de</span>
            <span class="slogan-word">Alimentos</span>
          </h2>
        </div>

        <div class="footer">ULEAM &middot; Planta de Alimentos &middot; 2026</div>
      </div>

      <script>
        (function () {
          if (typeof window === "undefined" || !window.gsap) return;
          window.__timelines = window.__timelines || {};
          const tl = window.gsap.timeline({ paused: true });

          // ANIMATION ORDER: stripe -> logo -> PAuleam title -> slogan -> footer
          tl.fromTo(".ecuador-stripe > div:nth-child(1)", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out", transformOrigin: "top center" }, 0);
          tl.fromTo(".ecuador-stripe > div:nth-child(2)", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out", transformOrigin: "top center" }, 0.05);
          tl.fromTo(".ecuador-stripe > div:nth-child(3)", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out", transformOrigin: "top center" }, 0.1);

          // 1) logo
          tl.fromTo(".logo-frame", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.4)" }, 0.2);

          // 2) PAuleam title
          tl.fromTo(".wordmark", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 0.6);

          // 3) slogan — word by word
          tl.fromTo(".slogan-word", { y: 12, opacity: 0 }, {
            y: 0,
            opacity: 1,
            duration: 0.4,
            stagger: 0.08,
            ease: "power2.out"
          }, 1.4);

          // 4) footer — appears at 2.0s, length 0.3s
          tl.fromTo(".footer", { opacity: 0 }, { opacity: 0.6, duration: 0.3, ease: "power2.out" }, 2.0);

          window.__timelines["beat-1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
