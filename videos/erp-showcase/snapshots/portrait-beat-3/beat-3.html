<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>PAuleam — Beat 3: Cliente (Portrait)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <template id="beat-3-template">
      <style>
        #root {
          position: relative;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: #FFFFFF;
          font-family: "Inter", system-ui, sans-serif;
          color: #121212;
        }
        .ecuador-stripe {
          position: absolute;
          top: 0; right: 0;
          width: 16px;
          height: 1920px;
          display: flex;
          flex-direction: column;
          z-index: 10;
        }
        .ecuador-stripe > div { flex: 1; }
        .ecuador-stripe .s-y { background: #FCD116; }
        .ecuador-stripe .s-b { background: #003893; }
        .ecuador-stripe .s-r { background: #CC0000; }

        .role-badge {
          position: absolute;
          top: 60px; left: 60px;
          background: #CC0000;
          color: #FFFFFF;
          font-family: "Inter", system-ui, sans-serif;
          font-weight: 700;
          font-size: 16px;
          letter-spacing: 0.1em;
          text-transform: uppercase;
          padding: 10px 22px;
          border-radius: 999px;
          z-index: 5;
        }
        .headline {
          position: absolute;
          top: 140px; left: 60px; right: 100px;
          font-family: "Inter", system-ui, sans-serif;
          font-weight: 700;
          font-size: 44px;
          color: #121212;
          z-index: 5;
          margin: 0;
          line-height: 1.1;
          letter-spacing: -0.5px;
        }

        .camera {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          transform-origin: center center;
          z-index: 1;
        }

        .screenshot-wrap {
          position: absolute;
          top: 300px;
          left: 108px;
          width: 864px;
          height: 900px;
          background: #FFFFFF;
          border: 1px solid #E5E5E5;
          border-radius: 10px;
          overflow: hidden;
        }
        .screenshot-wrap img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: top center;
          display: block;
        }

        .product-overlay {
          position: absolute;
          width: 240px;
          height: 360px;
          background: transparent;
          border: 2px solid transparent;
          border-radius: 10px;
          z-index: 4;
        }
        .product-overlay.o1 { top: 360px; left: 160px; }
        .product-overlay.o2 { top: 360px; left: 408px; }
        .product-overlay.o3 { top: 360px; left: 656px; }

        .agregar-overlay {
          position: absolute;
          top: 720px;
          left: 195px;
          width: 110px;
          height: 44px;
          background: #CC0000;
          border-radius: 10px;
          z-index: 4;
        }

        .pickup-card {
          position: absolute;
          left: 60px;
          right: 80px;
          bottom: 80px;
          background: #FFFFFF;
          border: 2px solid #E5E5E5;
          border-radius: 10px;
          padding: 36px 40px;
          text-align: center;
          z-index: 8;
          box-shadow: 0 12px 32px rgba(0,0,0,0.08);
        }
        .pickup-eyebrow {
          font-family: "Inter", system-ui, sans-serif;
          font-weight: 500;
          font-size: 18px;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: #4A4A49;
          margin-bottom: 18px;
        }
        .pickup-code {
          font-family: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace;
          font-weight: 800;
          font-size: 88px;
          line-height: 1;
          color: #CC0000;
          font-variant-numeric: tabular-nums;
          letter-spacing: 0.02em;
          margin-bottom: 22px;
        }
        .pickup-code .prefix {
          font-weight: 500;
          font-size: 36px;
          color: #4A4A49;
          margin-right: 8px;
        }
        .verificado {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          font-family: "Inter", system-ui, sans-serif;
          font-weight: 600;
          font-size: 22px;
          color: #4A4A49;
          margin-top: 6px;
        }
        .verificado .dot {
          display: inline-block;
          width: 18px;
          height: 18px;
          border-radius: 50%;
          background: #94C11F;
          box-shadow: 0 0 0 0 rgba(148,193,31,0.6);
        }
      </style>

      <div id="root" data-composition-id="beat-3" data-width="1080" data-height="1920" data-duration="9">
        <div class="ecuador-stripe"><div class="s-y"></div><div class="s-b"></div><div class="s-r"></div></div>
        <div class="role-badge">Cliente</div>
        <h1 class="headline">Compra y retira con código</h1>
        <div class="camera">
          <div class="screenshot-wrap">
            <img src="capture/screenshots/admin/14-shop-catalog.png" alt="Catálogo de productos PAuleam" />
          </div>
          <div class="product-overlay o1"></div>
          <div class="product-overlay o2"></div>
          <div class="product-overlay o3"></div>
          <div class="agregar-overlay"></div>
        </div>
        <div class="pickup-card">
          <div class="pickup-eyebrow">Tu código de retiro</div>
          <div class="pickup-code"><span class="prefix">PAU-</span><span id="pickup-suffix">79C209F3</span></div>
          <div class="verificado"><span class="dot"></span>Verificado</div>
        </div>
      </div>

      <script>
        (function () {
          if (typeof window === "undefined" || !window.gsap) return;
          window.__timelines = window.__timelines || {};
          const tl = window.gsap.timeline({ paused: true });

          tl.fromTo(".ecuador-stripe > div:nth-child(1)", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out", transformOrigin: "top center" }, 0);
          tl.fromTo(".ecuador-stripe > div:nth-child(2)", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out", transformOrigin: "top center" }, 0.05);
          tl.fromTo(".ecuador-stripe > div:nth-child(3)", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out", transformOrigin: "top center" }, 0.1);

          tl.fromTo(".role-badge", { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.2);
          tl.fromTo(".headline", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.3);
          tl.fromTo(".camera .screenshot-wrap", { opacity: 0, y: 16, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power2.out" }, 0);
          tl.fromTo(".product-overlay.o1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.5);
          tl.fromTo(".product-overlay.o2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.6);
          tl.fromTo(".product-overlay.o3", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.7);
          tl.fromTo(".agregar-overlay", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.0);
          tl.to(".agregar-overlay", { scale: 1.05, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.inOut" }, 2.5);

          tl.fromTo(".pickup-card", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.6)" }, 3.5);

          const fullCode = "79C209F3";
          const target = document.getElementById("pickup-suffix");
          if (target) {
            tl.set(target, { textContent: "" }, 0);
            for (let i = 1; i <= fullCode.length; i++) {
              tl.set(target, { textContent: fullCode.slice(0, i) }, 4.4 + i * 0.06);
            }
          }

          tl.fromTo(".verificado", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, transformOrigin: "center center", duration: 0.4, ease: "back.out(1.4)" }, 5.0);
          tl.to(".verificado .dot", { scale: 1.2, duration: 0.7, yoyo: true, repeat: 1, ease: "sine.inOut" }, 5.4);
          tl.to(".verificado .dot", { opacity: 0.5, duration: 0.7, yoyo: true, repeat: 1, ease: "sine.inOut" }, 5.4);

          tl.fromTo(".camera", { scale: 1.0 }, { scale: 1.03, duration: 5.5, ease: "sine.inOut" }, 3.5);

          window.__timelines["beat-3"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
